  <text x="88" y="274" fill="#f5f0e6" font-family="Inter, Arial, sans-serif" font-size="72" font-weight="750" letter-spacing="-2">Generation is not admission.</text>
  <text x="88" y="354" fill="#a9c2b5" font-family="Inter, Arial, sans-serif" font-size="31">AI can write the patch. Maintainers set the terms.</text>
